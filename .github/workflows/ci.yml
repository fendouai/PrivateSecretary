name: macOS verification

# Manual by default: GitHub-hosted macOS runners require a paid plan for private
# repositories. Run `make verify` locally; configure a macOS runner and dispatch
# this workflow when one is available.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Lint
        run: make lint
      - name: Tests
        run: make test
      - name: Smoke
        run: make smoke
      - name: App smoke
        run: make app-test
      - name: Installer packaging
        run: make install-test
      - name: Agent integrations
        run: make agent-test
      - name: Soak
        run: make soak
