name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Lint
        run: make lint
      - name: Tests
        run: make test
      - name: Smoke
        run: make smoke
      - name: Installer packaging
        run: make install-test
      - name: Soak
        run: make soak
