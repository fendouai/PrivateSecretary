name: macOS verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Lint
        run: make lint
      - name: Tests
        run: make test
      - name: Smoke
        run: make smoke
      - name: E2E
        run: make e2e
      - name: Agent integrations
        run: make agent-test
      - name: Soak
        run: make soak
